<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEE - Traslado de Materiales</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="login-container" class="container">
    <header>
        <div style="background-color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://github.com/proyectosjdop-alfa/app_poda/blob/main/imagenes/UTCD%20Vertical.png?raw=true" alt="Logo ENEE" style="max-width: 250px; height: auto;">
        </div>
        <h1>Acceso Traslados</h1>
    </header>
    <div class="card">
        <label>Sector:</label>
        <select id="user">
            <option value="">Seleccione...</option>
            <option value="brus laguna">BRUS LAGUNA</option>
            <option value="choluteca">CHOLUTECA</option>
            <option value="comayagua">COMAYAGUA</option>
            <option value="danli">DANLI</option>
            <option value="el progreso">EL PROGRESO</option>
            <option value="juticalpa">JUTICALPA</option>
            <option value="la ceiba">LA CEIBA</option>
            <option value="san pedro sula">SAN PEDRO SPLA</option>
            <option value="santa barbara">SANTA BARBARA</option>
            <option value="santa rosa">SANTA ROSA</option>
            <option value="santa cruz">SANTA CRUZ</option>
            <option value="tegucigalpa">TEGUCIGALPA</option>
            <option value="tocoa">TOCOA</option>
        </select>
        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn-enviar" onclick="validarLogin()">INGRESAR</button>
        <p id="login-error" style="color: #e74c3c; font-size: 0.8rem; margin-top: 10px; display: none;">Credenciales incorrectas</p>
    </div>
</div>

<div id="form-traslado-container" class="container" style="display: none;">
    <header>
        <div style="background-color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://github.com/proyectosjdop-alfa/app_poda/blob/main/imagenes/UTCD%20Vertical.png?raw=true" alt="Logo ENEE" style="max-width: 180px; height: auto;">
        </div>
        <h1>TRASLADO DE MATERIALES</h1>
        <p id="user-display" style="color: var(--accent); font-weight: bold; font-size: 0.8rem;"></p>
    </header>

    <form id="form-traslado">
        <label>Encargado de asignar:</label>
        <input type="text" id="resp-traslado" placeholder="Nombre completo">

        <label>Cuadrilla que recibe:</label>
        <input type="text" id="cuadrilla-recibe" placeholder="Nombre de cuadrilla">

        <div class="card" style="margin-top: 15px; border: 1px solid var(--accent);">
            <h3 style="color: var(--accent); font-size: 0.9rem; margin-bottom: 10px;">DETALLE DE MATERIAL</h3>
            
            <label>Tipo:</label>
            <select id="filtro-tipo" onchange="filtrarMateriales()">
                <option value="">Cargando tipos...</option>
            </select>

            <label>Material:</label>
            <select id="seleccion-material">
                <option value="">Seleccione tipo primero</option>
            </select>

            <label>Cantidad:</label>
            <input type="number" id="cantidad-input" placeholder="0">

            <button type="button" class="btn-secundario" onclick="agregarALista()">+ AGREGAR A LA LISTA</button>
        </div>

        <label style="margin-top: 20px; display: block;">Vista Previa del Informe:</label>
        <div class="card" style="padding: 10px; background: #1b2a36;">
            <div style="display: grid; grid-template-columns: 2fr 4fr 2fr 1fr; gap: 5px; border-bottom: 1px solid var(--accent); padding-bottom: 5px; font-size: 0.7rem; color: var(--accent); font-weight: bold; text-align: center;">
                <div>CÓDIGO</div>
                <div>DESCRIPCIÓN</div>
                <div>CANT.</div>
                <div></div>
            </div>
            <div id="lista-previa" style="margin-top: 10px;">
                <p style="font-size: 0.7rem; color: #9aa7b1; text-align: center;">Lista vacía</p>
            </div>
        </div>

        <button type="button" class="btn-enviar" onclick="generarPDFTraslado()">GENERAR PDF CON FORMATO</button>
    </form>
</div>

<script src="app.js"></script>
</body>
</html>
