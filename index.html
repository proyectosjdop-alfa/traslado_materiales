<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEE-UTCD - Traslado de Materiales</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="login-container" class="container">
    <header>
        <div style="background-color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 250px; height: auto;">
        </div>
        <h1>Acceso Traslados</h1>
    </header>
    <div class="card">
        <div id="login-error" style="display: none; color: #ff4d4d; text-align: center; margin-bottom: 10px; font-size: 0.9rem;">Contraseña incorrecta</div>
        <label>Sector:</label>
        <select id="user">
            <option value="">Seleccione...</option>
            <option value="brus laguna">BRUS LAGUNA</option>
            <option value="choluteca">CHOLUTECA</option>
            <option value="comayagua">COMAYAGUA</option>
            <option value="danli">DANLI</option>
            <option value="el progreso">EL PROGRESO</option>
            <option value="juticalpa">JUTICALPA</option>
            <option value="la ceiba">LA CEIBA</option>
            <option value="san pedro sula">SAN PEDRO SPLA</option>
            <option value="santa barbara">SANTA BARBARA</option>
            <option value="santa rosa">SANTA ROSA</option>
            <option value="santa cruz">SANTA CRUZ</option>
            <option value="tegucigalpa">TEGUCIGALPA</option>
            <option value="tocoa">TOCOA</option>
        </select>
        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn-enviar" onclick="validarLogin()">INGRESAR</button>
    </div>
</div>

<div id="form-traslado-container" class="container" style="display: none;">
    <header>
        <div style="background-color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 180px; height: auto;">
        </div>
        <h1>TRASLADO DE MATERIALES</h1>
        <p id="user-display" style="color: var(--accent); font-weight: bold; font-size: 0.8rem;"></p>
    </header>

    <form id="form-traslado">
        <label>Encargado de asignar:</label>
        <input type="text" id="resp-traslado" placeholder="Nombre completo">

        <label>Cuadrilla que recibe:</label>
        <input type="text" id="cuadrilla-recibe" placeholder="Nombre de cuadrilla">

        <div class="card" style="margin-top: 15px; border: 1px solid var(--accent);">
            <label>Tipo:</label>
            <select id="filtro-tipo" onchange="filtrarMateriales()"></select>
            <label>Material:</label>
            <select id="seleccion-material"></select>
            <label>Cantidad:</label>
            <input type="number" id="cantidad-input" placeholder="0">
            <button type="button" class="btn-secundario" onclick="agregarALista()">+ AGREGAR A LA LISTA</button>
        </div>

        <div class="card" style="padding: 10px; background: #1b2a36;">
            <div id="lista-previa"></div>
        </div>

        <button type="button" class="btn-enviar" onclick="abrirFirma()">PASAR A FIRMAS Y GENERAR</button>
    </form>
</div>

<div id="modal-firma" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; justify-content:center; align-items:center; overflow-y: auto;">
    <div style="background:white; padding:15px; border-radius:10px; text-align:center; width:95%; max-width:450px; margin: 20px auto;">
        <h2 style="color:#1b2a36; margin-bottom:15px; font-size: 1.2rem;">Panel de Firmas</h2>
        
        <div style="margin-bottom: 20px;">
            <p style="color:black; font-weight:bold; font-size:0.9rem; margin-bottom:5px;">Firma: Entregado por (Obligatorio)</p>
            <canvas id="canvas-entrega" style="border:2px solid #333; background:#fff; width:100%; height:130px; touch-action:none; border-radius:5px;"></canvas>
            <button type="button" onclick="limpiarFirma('entrega')" style="margin-top:5px; padding:5px 10px; font-size:0.7rem; cursor:pointer;">Limpiar Firma Entrega</button>
        </div>

        <div style="margin-bottom: 20px;">
            <p style="color:black; font-weight:bold; font-size:0.9rem; margin-bottom:5px;">Firma: Recibido por (Opcional)</p>
            <canvas id="canvas-recibe" style="border:2px solid #333; background:#fff; width:100%; height:130px; touch-action:none; border-radius:5px;"></canvas>
            <button type="button" onclick="limpiarFirma('recibe')" style="margin-top:5px; padding:5px 10px; font-size:0.7rem; cursor:pointer;">Limpiar Firma Recibe</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="btn-enviar" style="margin:0; width:100%;" onclick="finalizarYGenerar()">GUARDAR Y GENERAR PDF</button>
            <button style="background:none; border:none; color:#777; cursor:pointer; text-decoration:underline;" onclick="cerrarFirma()">Regresar al formulario</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
