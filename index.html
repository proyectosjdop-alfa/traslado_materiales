<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEE_UTCD - Traslado de Materiales</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div id="login-container" class="container">
    <header>
        <div style="background-color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 250px; height: auto;">
        </div>
        <h1>Traslado de Materiales</h1>
        <p style="color: white; font-size: 0.9rem;">Acceso al Sistema</p>
    </header>
    <div class="card" style="padding: 20px;">
        <label>Seleccione su Sector:</label>
        <select id="user">
            <option value="">Seleccione...</option>
            <option value="brus laguna">BRUS LAGUNA</option>
            <option value="choluteca">CHOLUTECA</option>
            <option value="comayagua">COMAYAGUA</option>
            <option value="danli">DANLI</option>
            <option value="el progreso">EL PROGRESO</option>
            <option value="juticalpa">JUTICALPA</option>
            <option value="la ceiba">LA CEIBA</option>
            <option value="san pedro sula">SAN PEDRO SPLA</option>
            <option value="santa barbara">SANTA BARBARA</option>
            <option value="santa rosa">SANTA ROSA</option>
            <option value="santa cruz">SANTA CRUZ</option>
            <option value="tegucigalpa">TEGUCIGALPA</option>
            <option value="tocoa">TOCOA</option>
        </select>

        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Ingrese su contraseña">
        
        <button class="btn-enviar" onclick="validarLogin()">INGRESAR</button>
        <p id="login-error" style="color: #e74c3c; font-size: 0.8rem; margin-top: 10px; display: none;">Credenciales incorrectas</p>
    </div>
</div>

<div id="form-traslado-container" class="container" style="display: none;">
    <header>
        <div style="background-color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 180px; height: auto;">
        </div>
        <h1>TRASLADO DE MATERIALES</h1>
        <p id="user-display" style="color: var(--accent); font-weight: bold; font-size: 0.8rem;"></p>
    </header>

    <form id="form-traslado">
        <label>Información de Salida:</label>
        <input type="text" id="origen" placeholder="Almacén de Origen">
        
        <label>Información de Destino:</label>
        <input type="text" id="destino" placeholder="Almacén de Destino / Proyecto">

        <button type="button" class="btn-enviar" onclick="alert('Próximamente: Generar PDF de Materiales')">GENERAR COMPROBANTE</button>
    </form>
</div>

<script src="app.js"></script>
</body>
</html>
