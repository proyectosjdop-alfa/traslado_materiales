<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENEE - Traslado de Materiales</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="login-container" class="container">
    <header>
        <div style="background-color: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 250px; height: auto;">
        </div>
        <h1>Acceso Traslados</h1>
    </header>
    <div class="card">
        <label>Sector:</label>
        <select id="user">
            <option value="">Seleccione...</option>
            <option value="brus laguna">BRUS LAGUNA</option>
            <option value="choluteca">CHOLUTECA</option>
            <option value="comayagua">COMAYAGUA</option>
            <option value="danli">DANLI</option>
            <option value="el progreso">EL PROGRESO</option>
            <option value="juticalpa">JUTICALPA</option>
            <option value="la ceiba">LA CEIBA</option>
            <option value="san pedro sula">SAN PEDRO SPLA</option>
            <option value="santa barbara">SANTA BARBARA</option>
            <option value="santa rosa">SANTA ROSA</option>
            <option value="santa cruz">SANTA CRUZ</option>
            <option value="tegucigalpa">TEGUCIGALPA</option>
            <option value="tocoa">TOCOA</option>
        </select>
        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Contraseña">
        <button class="btn-enviar" onclick="validarLogin()">INGRESAR</button>
    </div>
</div>

<div id="form-traslado-container" class="container" style="display: none;">
    <header>
        <div style="background-color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: center;">
            <img src="https://raw.githubusercontent.com/proyectosjdop-alfa/traslado_materiales/refs/heads/main/imagenes/UTCD%20Vertical.png" alt="Logo ENEE" style="max-width: 180px; height: auto;">
        </div>
        <h1>TRASLADO DE MATERIALES</h1>
        <p id="user-display" style="color: var(--accent); font-weight: bold; font-size: 0.8rem;"></p>
    </header>

    <form id="form-traslado">
        <label>Encargado de asignar:</label>
        <input type="text" id="resp-traslado" placeholder="Nombre completo">

        <label>Cuadrilla que recibe:</label>
        <input type="text" id="cuadrilla-recibe" placeholder="Nombre de cuadrilla">

        <div class="card" style="margin-top: 15px; border: 1px solid var(--accent);">
            <label>Tipo:</label>
            <select id="filtro-tipo" onchange="filtrarMateriales()"></select>
            <label>Material:</label>
            <select id="seleccion-material"></select>
            <label>Cantidad:</label>
            <input type="number" id="cantidad-input" placeholder="0">
            <button type="button" class="btn-secundario" onclick="agregarALista()">+ AGREGAR A LA LISTA</button>
        </div>

        <div class="card" style="padding: 10px; background: #1b2a36;">
            <div id="lista-previa"></div>
        </div>

        <button type="button" class="btn-enviar" onclick="abrirFirma()">FIRMAR Y GENERAR PDF</button>
    </form>
</div>

<div id="modal-firma" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; flex-direction:column;">
    <div style="background:white; padding:20px; border-radius:10px; text-align:center; width:90%; max-width:400px;">
        <h3 style="color:black; margin-bottom:10px;">Firma del que entrega</h3>
        <canvas id="canvas-firma" style="border:2px solid #000; background:#fff; width:100%; height:200px; touch-action:none;"></canvas>
        <div style="margin-top:15px; display:flex; gap:10px;">
            <button class="btn-secundario" style="color:black; border-color:black;" onclick="limpiarFirma()">LIMPIAR</button>
            <button class="btn-enviar" style="margin:0;" onclick="finalizarYGenerar()">GUARDAR Y GENERAR</button>
        </div>
        <button style="margin-top:10px; background:none; border:none; color:red; cursor:pointer;" onclick="cerrarFirma()">Cancelar</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
